name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Compile T122 frequency-aggregated frontier candidate
        run: lake env lean TheoryLib/PiQuantitativeBlockHitting/T122T122FrequencyAggregatedNaturalScaleFrontier.lean
      - name: Run strict research verification gate
        shell: pwsh
        run: ./workflows/verification/check.ps1
      - uses: leanprover-community/docgen-action@v1
