name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Run strict research verification gate
        shell: pwsh
        run: ./workflows/verification/check.ps1
      - name: Run weighted active-support exact gate
        shell: pwsh
        run: ./workflows/verification/check.ps1 -AuditFile audit/AxiomAudit.WeightedActiveSupport.lean

  docs:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
