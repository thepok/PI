name: GP-0002 self-reporting verification

on:
  push:
    branches:
      - pi-core-consolidation
    paths:
      - TheoryLib/PiQuantitativeBlockHitting/T110T110PostT17CancellationCriterion.lean
      - TheoryLib.lean
      - audit/AxiomAudit.lean
      - GPTPro/Deliverables/GP-0002/promote_t110.py
      - .github/workflows/gptpro_gp0002_verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Record workflow start
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          marker="GPTPro/Deliverables/GP-0002/ci-started/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          mkdir -p "$(dirname "$marker")"
          {
            echo "# GP-0002 verification run started"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
          } >"$marker"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "mark GP-0002 verification run started [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin pi-core-consolidation
            git rebase origin/pi-core-consolidation
            if git push origin HEAD:pi-core-consolidation; then
              exit 0
            fi
          done
          exit 1

      - name: Install pinned Lean and dependencies
        id: lean-action
        uses: leanprover/lean-action@v1
        continue-on-error: true
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Run isolated build, guarded promotion, and strict gate
        shell: bash
        env:
          LEAN_ACTION_OUTCOME: ${{ steps.lean-action.outcome }}
        run: |
          set +e
          mkdir -p GPTPro/Deliverables/GP-0002
          isolated_log="$(mktemp)"
          promotion_log="$(mktemp)"
          gate_log="$(mktemp)"

          lake build TheoryLib.PiQuantitativeBlockHitting.T110T110PostT17CancellationCriterion \
            >"$isolated_log" 2>&1
          isolated_exit=$?

          promotion_exit=125
          gate_exit=125
          promotion_applied=false
          if [ "$isolated_exit" -eq 0 ]; then
            python3 GPTPro/Deliverables/GP-0002/promote_t110.py \
              >"$promotion_log" 2>&1
            promotion_exit=$?
            if [ "$promotion_exit" -eq 0 ]; then
              if ! git diff --quiet -- TheoryLib.lean audit/AxiomAudit.lean; then
                promotion_applied=true
              fi
              pwsh workflows/verification/check.ps1 >"$gate_log" 2>&1
              gate_exit=$?
            fi
          fi

          if [ "$isolated_exit" -ne 0 ]; then
            echo "not run: isolated T110 build failed" >"$promotion_log"
            echo "not run: isolated T110 build failed" >"$gate_log"
          elif [ "$promotion_exit" -ne 0 ]; then
            echo "not run: deterministic promotion failed" >"$gate_log"
          fi

          report="GPTPro/Deliverables/GP-0002/CI_VERIFICATION.md"
          {
            echo "# GP-0002 CI verification"
            echo
            echo "- Commit under test: \`$GITHUB_SHA\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Run attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Runner: \`ubuntu-latest\`"
            echo "- Lean setup outcome: \`$LEAN_ACTION_OUTCOME\`"
            echo "- Isolated T110 build exit: \`$isolated_exit\`"
            echo "- Deterministic promotion exit: \`$promotion_exit\`"
            echo "- Promotion changed canonical files: \`$promotion_applied\`"
            echo "- Strict repository gate exit: \`$gate_exit\`"
            echo
            echo "## Isolated T110 build output (last 400 lines)"
            echo
            echo '```text'
            tail -n 400 "$isolated_log"
            echo '```'
            echo
            echo "## Deterministic promotion output"
            echo
            echo '```text'
            cat "$promotion_log"
            echo '```'
            echo
            echo "## Strict repository gate output (last 400 lines)"
            echo
            echo '```text'
            tail -n 400 "$gate_log"
            echo '```'
          } >"$report"

          if [ "$isolated_exit" -eq 0 ] && [ "$promotion_exit" -eq 0 ] && [ "$gate_exit" -eq 0 ]; then
            printf '\nRESULT: PASS\n' >>"$report"
          else
            printf '\nRESULT: FAIL\n' >>"$report"
            git restore -- TheoryLib.lean audit/AxiomAudit.lean
          fi

      - name: Commit successful promotion and verification evidence without forcing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TheoryLib.lean audit/AxiomAudit.lean \
            GPTPro/Deliverables/GP-0002/CI_VERIFICATION.md
          if git diff --cached --quiet; then
            exit 0
          fi

          if git diff --cached --name-only | grep -Eq '^(TheoryLib\.lean|audit/AxiomAudit\.lean)$'; then
            message="promote GP-0002 T110 and record verification"
          else
            message="record GP-0002 CI verification [skip ci]"
          fi
          git commit -m "$message"

          for attempt in 1 2 3; do
            git fetch origin pi-core-consolidation
            git rebase origin/pi-core-consolidation
            if git push origin HEAD:pi-core-consolidation; then
              exit 0
            fi
          done
          exit 1
