open_problems:
  - id: P1-FD
    statement: "For every (m,w,A,c)∈𝔓₁, dim_H(C_w∩BA∩ALA_(A,c))=d_w."
    strength_order: [P1-FD, P1-PD, P1-NE]
    would_resolve: "It gives the full-dimension BA-ALA separator intersection."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p1-the-ba--ala-intersection-problems"
  - id: P1-PD
    statement: "For every (m,w,A,c)∈𝔓₁, dim_H(C_w∩BA∩ALA_(A,c))>0."
    strength_order: [P1-FD, P1-PD, P1-NE]
    would_resolve: "It gives positive-dimensional BA-ALA intersections."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p1-the-ba--ala-intersection-problems"
  - id: P1-NE
    statement: "For every (m,w,A,c)∈𝔓₁, C_w∩BA∩ALA_(A,c) is nonempty."
    strength_order: [P1-FD, P1-PD, P1-NE]
    would_resolve: "It gives a BA word-avoider with all-label abundance."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p1-the-ba--ala-intersection-problems"
  - id: P1-FD-loc
    statement: "For every (m,w,A,c)∈𝔓₁ and finite P with C_w∩I(P) nonempty, dim_H(X(w,A,c)∩I(P))=d_w."
    strength_order: [P1-FD-loc, P1-FD, P1-PD, P1-NE]
    would_resolve: "It strengthens P1-FD locally."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p1-the-ba--ala-intersection-problems"
  - id: "P1′"
    statement: "For every nonempty one-sided base-b SFT, every sparse entropy-neutral forced-block datum, and 0<s<d_Σ, some κ>0 gives dim_H(K_(Σ,F)∩BA(κ))≥s."
    would_resolve: "It supplies fixed-level BA dimension in every sparse forced corridor."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p1-sparse-forced-blocks-in-finite-type-subshifts"
  - id: MC0
    statement: "For every k≥1, some m,n≥0 satisfy 10^k R^M_(m,n)+10^(n+k)Δ_m<D^M_m."
    strength_order: [SOH-3/7, MC0]
    would_resolve: "It is equivalent to CW0."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p2-the-one-sided-residue-problems"
  - id: SOH-3/7
    statement: "For every k,M≥1, some m≥M and n≥0 satisfy 10^k R^M_(m,n)+10^(n+k)Δ_m<D^M_m."
    strength_order: [SOH-3/7, MC0]
    would_resolve: "It is equivalent to MC0 and CW0."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p2-the-one-sided-residue-problems"
  - id: SOH-BBP-10-0
    statement: "For every k,N≥1, some n≥max(N,2) satisfies 0<r_n/D^B_n+E_n−a<10^(−k)."
    would_resolve: "It is equivalent to CW0."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p2-the-one-sided-residue-problems"
  - id: BBP-V1
    statement: "For every length ℓ≥1, word v, and N≥1, some n≥max(N,2) has 2η_n<10^(−ℓ) and r_n/D^B_n in the η_n-shrunken arc J(v)."
    would_resolve: "It implies V1."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p2-the-one-sided-residue-problems"
  - id: P3
    statement: "There exist q,s,B>0, Z∈ℤ, absolutely summable integer coefficients, and increasing blocks with B=10^s, π/q=Z+Σa_mB^(−m), h_j→∞, block divisibility, and tail in (0,B^(−h_j))."
    would_resolve: "It is equivalent to CW0."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p3-the-carry-certificate-reformulation"
  - id: P4
    statement: "For every α∈{π,√2,e,log 2} and δ∈{0,9}, every k≥1 occurs as a length-k decimal δ-run in α."
    would_resolve: "Its π components give CW0 and CW9; all eight components prove P4."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p4-the-constant-word-problems"
  - id: P5
    statement: "For every N≥0, the closure of {y_n:n≥N} for y_(n+1)={16y_n+R(n)} is [0,1]."
    would_resolve: "It is equivalent to D16 and hence to D2."
    label: conjecture
    source: "knowledge/pi/workstreams/OPEN_PROBLEMS.md#p5-the-base-16-density-problem"

